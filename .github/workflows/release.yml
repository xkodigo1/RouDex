name: Release

# Installers for Windows, macOS and Linux (spec 005, D4). On a published
# release they are attached to it; a manual run or a pull request that
# touches the packaging keeps them as workflow artifacts.
on:
  release:
    types: [published]
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/release.yml
      - scripts/bundle.mjs
      - src-tauri/tauri.bundle.json

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  installers:
    name: Installers (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            files: target/release/bundle/nsis/*.exe
          - name: macos
            os: macos-latest
            target: universal-apple-darwin
            bundles: app,dmg
            files: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          # The oldest Ubuntu LTS image available: the .deb and the
          # .AppImage then link against an older glibc and run on more
          # distributions.
          - name: linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
            files: |
              target/release/bundle/deb/*.deb
              target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: release-${{ runner.os }}-
      - name: Install Tauri system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf file xvfb
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm --dir ui install --frozen-lockfile
      - name: Build the installers
        env:
          # The AppImage tooling runs without FUSE on the runner.
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: node scripts/bundle.mjs --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Start the Linux app for a few seconds
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set +e
          ROUDEX_HOME="$RUNNER_TEMP/roudex-home" xvfb-run -a timeout 15 ./target/release/roudex-desktop
          code=$?
          # 124: still running when the timeout stopped it, as expected.
          if [ "$code" -ne 124 ]; then echo "the app exited with $code"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error
      - name: Attach to the release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(${{ matrix.name == 'linux' && 'target/release/bundle/deb/*.deb target/release/bundle/appimage/*.AppImage' || matrix.files }})
          gh release upload "${{ github.event.release.tag_name }}" "${files[@]}" --clobber
