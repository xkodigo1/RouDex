<!doctype html>
<html lang="es"><head><meta charset="UTF-8"><title>RouDex local IPC fixture</title></head>
<body>
<nav aria-label="Fixture controls">
  <button id="populated">Fixture: populated</button><button id="empty">Fixture: empty</button>
  <button id="read-error">Fixture: read error</button><button id="event-error">Fixture: event error</button>
  <button id="slow">Fixture: loading</button><button id="reordered">Fixture: reordered</button>
  <button id="removed">Fixture: removed</button><button id="missing">Fixture: missing store</button>
  <button id="verify">Run overview checks</button>
  <button id="verify-details">Run detail checks</button>
</nav>
<pre id="verification" aria-live="polite"></pre>
<div id="root"></div>
<script type="module">
// Development-only synthetic fixture, excluded from the production entrypoint.
import { mockIPC } from "@tauri-apps/api/mocks";
let mode = "populated";
const commands = [];
for (const id of ["populated", "empty", "read-error", "event-error", "slow", "reordered", "removed", "missing"]) {
  document.getElementById(id).onclick = () => { mode = id; };
}
const statuses = ["planned", "ready", "awaiting_approval", "running", "completed", "failed", "blocked", "interrupted"];
const tasks = [
  {id:"FIXTURE-A", title:"Needs approval", status:"awaiting_approval", milestone_id:"H2"},
  {id:"FIXTURE-B", title:"Failed check", status:"failed", milestone_id:"H2", dependencies:"FIXTURE-A"},
  {id:"FIXTURE-C", title:"Completed baseline", status:"completed", milestone_id:"H1"},
  {id:"FIXTURE-D", title:"Unassigned task", status:"planned", milestone_id:null},
].map((task) => ({...task, selection_key:task.id, spec_id:"fixture", model:"fixture-model", profile:"standard", effort:"medium", approval:task.id === "FIXTURE-C" ? "not_required" : "manual"}));
const runs = [
  {run_id:"fixture-run-a", route_id:"fixture-route-a", task_id:"FIXTURE-A", status:"interrupted", model:"fixture-model", effort:"medium", created_at:"100"},
  {run_id:"fixture-run-b", route_id:"fixture-route-b", task_id:"FIXTURE-B", status:"failed", model:"fixture-model", effort:"medium", created_at:"99"},
  {run_id:"fixture-retry-b", route_id:"fixture-route-b", task_id:"FIXTURE-B", status:"failed", model:"fixture-model", effort:"medium", created_at:"101"},
].reverse().map((run) => ({...run, selection_key:run.run_id}));
const counts = (items) => Object.fromEntries(statuses.map((status) => [status, items.filter((task) => task.status === status).length]));
mockIPC(async (cmd, args) => {
  commands.push(cmd);
  if (cmd === "local_snapshot") {
    const requestedMode = mode;
    if (requestedMode === "read-error") throw new Error("Fixture: database unavailable");
    if (requestedMode === "slow") await new Promise((resolve) => setTimeout(resolve, 1800));
    const selected = ["empty", "missing"].includes(requestedMode) ? [] : requestedMode === "removed" ? tasks.filter((task) => task.id !== "FIXTURE-B") : requestedMode === "reordered" ? [...tasks].reverse() : tasks;
    const milestones = [...new Set(selected.map((task) => task.milestone_id))].map((milestone_id) => {
      const members = selected.filter((task) => task.milestone_id === milestone_id);
      return {spec_id:"fixture", milestone_id, task_total:members.length, status_counts:counts(members)};
    });
    return {state_path:"fixture.sqlite3", initialized:requestedMode !== "missing", tasks:selected,
      task_total:selected.length, status_counts:counts(selected), milestones,
      runs:selected.length ? runs : [], approvals:[
        {id:1,task_id:"FIXTURE-A",decision:"approved",latest:true,reason:"Synthetic review",created_at:"98"},
        {id:2,task_id:"FIXTURE-B",decision:"denied",latest:true,reason:"Synthetic denial",created_at:"99"},
      ], errors:[], error_count:0};
  }
  if (cmd === "local_run_events") {
    const requestedMode = mode;
    if (requestedMode === "event-error") throw new Error("Fixture: events unavailable");
    await new Promise((resolve) => setTimeout(resolve, args.runId === "fixture-run-a" ? 1200 : 50));
    if (requestedMode === "late-error" && args.runId === "fixture-run-a") throw new Error("Fixture: delayed prior-run error");
    const runId = requestedMode === "mismatched" ? "fixture-wrong-run" : args.runId;
    const events = requestedMode === "no-events" ? [] : [3,1,2].map((id) => ({id, run_id:runId, event_type:`fixture.event.${id}`, created_at:String(102+id), payload:{text:runId}}));
    return {run_id:runId, total:events.length, events};
  }
  throw new Error(`Unexpected command: ${cmd}`);
});
localStorage.setItem("roudex.view", JSON.stringify("tareas"));
localStorage.removeItem("roudex.project");
localStorage.removeItem("roudex.recentProjects");
await import("../src/main.jsx");
// Browser-executed acceptance checks against the rendered React UI and IPC mock.
const pause = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
const root = () => document.getElementById("root");
const waitFor = async (check) => {
  for (let i = 0; i < 100; i++) { if (check()) return; await pause(50); }
  throw new Error("Timed out waiting for rendered state");
};
const refresh = async (nextMode) => {
  await waitFor(() => root().querySelector(".desk-heading button:not(:disabled)"));
  mode = nextMode;
  root().querySelector(".desk-heading button").click();
  await pause(80);
  await waitFor(() => root().querySelector(".desk-heading button:not(:disabled)"));
};
const filter = async (status) => {
  const select = root().querySelector("select");
  select.value = status;
  select.dispatchEvent(new Event("change", {bubbles:true}));
  await pause(80);
};
document.getElementById("verify").onclick = async () => {
  const output = document.getElementById("verification");
  const results = [];
  const check = (name, pass) => { if (!pass) throw new Error(name); results.push(`PASS: ${name}`); output.textContent = results.join("\n"); };
  document.getElementById("verify").disabled = true;
  try {
    await refresh("populated"); await filter("all");
    check("Four tasks, three runs including retry", root().querySelector(".metric-card strong").textContent === "4" && root().querySelectorAll(".task-button").length === 4 && root().querySelectorAll(".run-list li").length === 3);
    check("Milestone totals and completed progress", JSON.stringify([...root().querySelectorAll("progress")].map((p) => [p.value,p.max])) === "[[0,2],[1,1],[0,1]]");
    check("Unassigned milestone visible", root().querySelector(".milestone-list").textContent.includes("Sin hito asignado"));
    for (const status of statuses) {
      await filter(status);
      check(`Filter ${status}`, root().querySelectorAll(".task-button").length === tasks.filter((task) => task.status === status).length);
    }
    check("Empty filter message", root().textContent.includes("No hay tasks para este estado."));
    await filter("all");
    [...root().querySelectorAll(".task-button")].find((button) => button.textContent.includes("FIXTURE-B")).click(); await pause(80);
    await refresh("reordered");
    check("Selection survives reordered refresh", root().querySelector('.task-button[aria-pressed="true"]').textContent.includes("FIXTURE-B"));
    await filter("completed");
    check("Filter retains hidden selection", root().querySelector(".task-selection").textContent.includes("FIXTURE-B") && root().textContent.includes("fuera del filtro"));
    await refresh("read-error");
    check("Error and stale data visible; selection retained", root().querySelector('[role="alert"]').textContent.includes("database unavailable") && root().textContent.includes("desactualizados") && root().querySelector(".task-selection").textContent.includes("FIXTURE-B"));
    await refresh("populated");
    check("Error recovery", !root().querySelector('[role="alert"]'));
    mode = "slow"; root().querySelector(".desk-heading button").click(); await pause(80);
    check("Loading visible with retained snapshot", root().textContent.includes("Leyendo estado local…") && root().querySelector(".desk-heading button").disabled && root().querySelector(".task-selection").textContent.includes("FIXTURE-B"));
    await waitFor(() => root().querySelector(".desk-heading button:not(:disabled)"));
    await filter("all"); await refresh("removed");
    check("Removed selection falls back deterministically", root().querySelector('.task-button[aria-pressed="true"]').textContent.includes("FIXTURE-A"));
    await refresh("empty");
    check("Empty snapshot clears selection", root().textContent.includes("No hay tasks registradas.") && root().textContent.includes("No hay task seleccionada.") && root().querySelectorAll("progress").length === 0);
    await refresh("missing");
    check("Missing store explicit", root().textContent.includes("Aún no existe estado local"));
    check("Read-only IPC commands only", commands.every((cmd) => ["local_snapshot", "local_run_events", "router_config", "chat_projects"].includes(cmd) || cmd.startsWith("plugin:event|")));
    await refresh("populated");
    output.textContent += `\n${results.length} checks passed. Synthetic browser evidence only; no native runtime claim.`;
  } catch (error) { output.textContent += `\nFAIL: ${error.message}`; }
  finally { document.getElementById("verify").disabled = false; }
};

document.getElementById("verify-details").onclick = async () => {
  const output = document.getElementById("verification");
  const results = [];
  output.textContent = "";
  const check = (name, pass) => { if (!pass) throw new Error(name); results.push(`PASS: ${name}`); output.textContent = results.join("\n"); };
  const detail = () => root().querySelector(".task-details");
  const events = () => root().querySelector('[aria-labelledby="events-title"]');
  const selectTask = async (id) => {
    [...root().querySelectorAll(".task-button")].find((button) => button.textContent.startsWith(`${id} ·`)).click();
    await pause(30);
  };
  const waitEvents = async (id) => {
    await waitFor(() => events().querySelectorAll(".event-list li").length === 3 && events().querySelector("code").textContent === id);
  };
  for (const id of ["verify", "verify-details"]) document.getElementById(id).disabled = true;
  try {
    await refresh("populated"); await filter("all");
    await selectTask("FIXTURE-B"); await waitEvents("fixture-retry-b");
    check("Selected task exposes route assignment", detail().textContent.includes("standard / fixture-model / medium"));
    check("Approval decision and reason visible", detail().textContent.includes("manual · denied") && detail().textContent.includes("Synthetic denial"));
    check("Latest task run and route identity visible", detail().textContent.includes("fixture-retry-b") && detail().textContent.includes("fixture-route-b"));
    check("Events ordered by persisted id", [...events().querySelectorAll("summary b")].map((element) => element.textContent).join(",") === "fixture.event.1,fixture.event.2,fixture.event.3");
    await filter("failed");
    detail().querySelector(".dependency-list button").click(); await pause(30);
    check("Dependency link selects exact task outside filter", root().querySelector(".task-selection").textContent.includes("FIXTURE-A") && root().textContent.includes("fuera del filtro"));
    check("Approved state visible", detail().textContent.includes("manual · approved"));
    await filter("all");
    await selectTask("FIXTURE-B"); await waitEvents("fixture-retry-b");
    check("Switch clears prior-run loading and identity", !events().textContent.includes("fixture-run-a"));
    await pause(1400);
    check("Late prior-run success cannot contaminate selected task", events().querySelector("code").textContent === "fixture-retry-b" && !events().textContent.includes("fixture-run-a"));
    mode = "late-error";
    await selectTask("FIXTURE-A");
    check("Event loading explicit", events().textContent.includes("Leyendo eventos…"));
    await selectTask("FIXTURE-B"); await waitEvents("fixture-retry-b"); await pause(1400);
    check("Late prior-run failure cannot contaminate selected task", !events().querySelector('[role="alert"]') && !events().textContent.includes("delayed prior-run error"));
    mode = "event-error";
    await selectTask("FIXTURE-C");
    check("Missing run identity explicit, prior events cleared", detail().textContent.includes("Sin identidad de ejecución") && events().textContent.includes("Sin identidad de ejecución") && !events().querySelector(".event-list"));
    check("Approval not required and no dependencies explicit", detail().textContent.includes("No requerida") && detail().textContent.includes("Sin dependencias"));
    await selectTask("FIXTURE-D");
    check("Unreviewed task approval remains pending", detail().textContent.includes("manual · Pendiente"));
    await selectTask("FIXTURE-B"); await waitFor(() => events().querySelector('[role="alert"]'));
    check("Event-read failure explicit", events().textContent.includes("events unavailable") && !events().querySelector(".event-list"));
    mode = "populated";
    events().querySelector("button").click(); await waitEvents("fixture-retry-b");
    check("Read-only event retry recovers", !events().querySelector('[role="alert"]'));
    [...root().querySelectorAll(".run-button")].find((button) => button.textContent.includes("fixture-run-b")).click();
    await waitEvents("fixture-run-b");
    check("Historical run navigation retains task and changes run", detail().textContent.includes("fixture-run-b") && root().querySelector(".task-selection").textContent.includes("FIXTURE-B"));
    await refresh("reordered");
    check("Refresh preserves explicit historical run", events().querySelector("code").textContent === "fixture-run-b");
    await refresh("no-events"); await waitFor(() => events().textContent.includes("No hay eventos registrados."));
    check("Empty event history explicit", events().textContent.includes("0 de 0 eventos"));
    await refresh("mismatched"); await waitFor(() => events().querySelector('[role="alert"]'));
    check("Wrong-run IPC response rejected", events().textContent.includes("no corresponde") && !events().querySelector(".event-list"));
    check("Read-only IPC commands only", commands.every((cmd) => ["local_snapshot", "local_run_events", "router_config", "chat_projects"].includes(cmd) || cmd.startsWith("plugin:event|")));
    await refresh("populated"); await selectTask("FIXTURE-B"); await waitEvents("fixture-retry-b");
    output.textContent += `\n${results.length} detail checks passed. Synthetic browser evidence only; no native runtime claim.`;
  } catch (error) { output.textContent += `\nFAIL: ${error.message}`; }
  finally { for (const id of ["verify", "verify-details"]) document.getElementById(id).disabled = false; }
};
</script>
</body></html>
