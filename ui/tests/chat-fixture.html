function summaries(includeArchived) {
  return threads.filter((t) => includeArchived || !t.archived).map((t) => {
    const list = turns[t.thread_id] ?? [];
    const last = list.at(-1);
    return { ...t, turns: list.length, tokens: list.reduce((s, x) => s + x.tokens.total, 0),
      last_status: last?.status ?? null, last_tier: last?.tier ?? null, last_model: last?.model ?? null };
  }).sort((a, b) => Number(b.updated_at) - Number(a.updated_at));
}

// ?desktop=empty shows the hook as not installed and without prompts.
let hookInstalled = false;
function desktopHook() {
  const empty = new URLSearchParams(location.search).get("desktop") === "empty";
  const bundled = new URLSearchParams(location.search).get("bundled") === "1";
  const hook = { path: String.raw`C:\Users\dev\.codex\hooks.json`, bundled, command: empty && !hookInstalled ? null : "C:/Users/dev/.roudex/bin/router-cli.exe hook" };
  if (empty) return { hook, summary: { days: 30, prompts: 0, today: 0, economico: 0, estandar: 0, fuerte: 0, unruled: 0, warned: 0, blocked: 0, on_recommended_model: 0, last_at: null } };
  return { hook, summary: { days: 30, prompts: 148, today: 9, economico: 61, estandar: 63, fuerte: 24, unruled: 63, warned: 7, blocked: 1, on_recommended_model: 92, last_at: String(now() - 240) } };
}

function dashboard() {
  const all = Object.values(turns).flat();
  const days = [];
  let seed = 7;
  const rand = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
  for (let ago = 364; ago >= 0; ago--) {
    const date = new Date(Date.now() - ago * 86400000);
    const weekend = date.getDay() === 0 || date.getDay() === 6;
    const r = rand();
    if (r < (weekend ? 0.65 : 0.22)) continue;
    const ramp = Math.min(1, (365 - ago) / 365 + 0.25);
    const pad = (n) => String(n).padStart(2, "0");
    days.push({ date: `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`, tokens: Math.round((r * r * 420 + 20) * ramp) * 1000, turns: 1 + Math.round(r * 9) });
  }
  const total = days.reduce((s, d) => s + d.tokens, 0);
  return {
    days, year: { input: Math.round(total * 0.9), cached_input: Math.round(total * 0.57), output: Math.round(total * 0.1), reasoning: 0, total },
    today_tokens: days.at(-1)?.tokens ?? 0, today_turns: days.at(-1)?.turns ?? 0, today_threads: 3, total_turns: 1248, streak_days: 9,
    models: [
      { model: "gpt-6.1-sol", turns: 520, tokens: { total: Math.round(total * 0.61) } },
      { model: "gpt-6-luna", turns: 690, tokens: { total: Math.round(total * 0.29) } },
      { model: "gpt-6-astra", turns: 38, tokens: { total: Math.round(total * 0.1) } },
    ],
    tiers: [
      { tier: "economico", turns: 724, by_source: [["rule", 512], ["model", 212]] },
      { tier: "estandar", turns: 374, by_source: [["model", 374]] },
      { tier: "fuerte", turns: 150, by_source: [["risk", 112], ["manual", 38]] },
    ],
    recent: summaries(false).slice(0, 5),
  };
}

function decide(prompt) {
  const text = prompt.toLowerCase();
  if (/(producci[oó]n|pago|comisi)/.test(text)) return { tier: "fuerte", ...config.tiers.fuerte, source: "risk", reason: "regla de riesgo: produccion", risk: [{ kind: "keyword", value: "produccion" }] };
  if (/^(explica|resume|traduce)/.test(text)) return { tier: "economico", ...config.tiers.economico, source: "rule", reason: "mensaje corto de tipo «explica»", risk: [] };
  return { tier: "estandar", ...config.tiers.estandar, source: "model", reason: "test acotado en código existente", risk: [] };
}

async function stream(threadId, record) {
  await wait(150);
  session({ type: "turnStarted", threadId, turnId: record.turn_id });
  if (/aprob|test/i.test(record.prompt)) {
    session({ type: "agentDelta", threadId, turnId: record.turn_id, delta: "Agrego el caso de diciembre con dos festivos y verifico el corte del día 15" });
    session({ type: "itemStarted", threadId, turnId: record.turn_id, item: { id: "cmd-" + record.turn_id, type: "commandExecution", command: "cargo test -p reports holidays" } });
    session({ type: "approvalRequested", requestId: 900 + counter, kind: "command", threadId, turnId: record.turn_id,
      itemId: "cmd-" + record.turn_id, command: "cargo test -p reports holidays", cwd: "C:\\proyectos\\api-service", reason: "fuera de la política del sandbox: necesita escribir en target/ compartido" });
    record.pending = true;
    return;
  }
  await finish(threadId, record, "Listo. Revisé el código y propongo:\n1. Ajustar el componente.\n2. Agregar tests.");
}

async function finish(threadId, record, answer) {
  for (const word of answer.split(/(?<= )/)) {
    session({ type: "agentDelta", threadId, turnId: record.turn_id, delta: word });
    await wait(25);
  }
  record.response = (record.response || "") + answer;
  record.status = "completed";
  record.tokens = { input: 19800, cached_input: 11000, output: 240, reasoning: 30, total: 20040 };
  limits = { ...limits, primary: { ...limits.primary, usedPercent: limits.primary.usedPercent + 2 } };
  session({ type: "rateLimits", snapshot: limits });
  session({ type: "turnCompleted", threadId, turnId: record.turn_id, status: "completed", error: null });
}

const OPEN = ["planned", "ready", "blocked", "awaiting_approval"];

const BEHAVIOUR = { "R1-T2": "approval", "R1-T4": "slow" };
const loadedSpecs = new Map();
const tasksById = new Map();
let activeRun = null;
let loadCounter = 0;

function loadSpec(slug) {
  const file = specFiles.find((item) => item.slug === slug);
  if (!file) throw new Error("no existe el manifiesto");
  if (file.error) throw new Error(file.error);
  for (const task of file.spec.tasks) {
    if (!tasksById.has(task.id)) tasksById.set(task.id, { specId: file.spec.specId, task: structuredClone(task), tierOverride: null, approval: null, runs: [] });
  }
  loadedSpecs.set(file.spec.specId, { ...file.spec, path: specPath(slug), loadedAt: String(now() + ++loadCounter) });
  return storedSpec(file.spec.specId);
}

function storedSpec(specId) {
  const { tasks, ...spec } = loadedSpecs.get(specId);
  const own = [...tasksById.values()].filter((item) => item.specId === specId);
  return { ...spec, tasks: own.length, completed: own.filter((item) => item.task.status === "completed").length };
}

function route(entry) {
  const { task, tierOverride } = entry;
  const risk = /producci[oó]n/i.test(`${task.title}\n${task.prompt}`) ? [{ kind: "keyword", value: "produccion" }] : [];
  const pick = (tier, source, reason) => ({ tier, ...config.tiers[tier], source, reason, risk });
  if (tierOverride) return pick(tierOverride, "manual", risk.length ? "elegido manualmente pese al riesgo (produccion)" : `elegido manualmente (la spec pide ${task.tier})`);
  if (risk.length) return pick("fuerte", "risk", "regla de riesgo: produccion");
  return pick(task.tier, "spec", task.profile ? `perfil ${task.profile} de la spec` : "tier de la spec");
}

const depsDone = (entry) => entry.task.depends_on.every((id) => tasksById.get(id)?.task.status === "completed");
const storedRun = (run) => run && { run_id: run.run_id, route_id: run.route_id, session_id: run.thread_id, turn_id: run.task_id, cwd: project,
  prompt: run.prompt, profile: run.tier, model: run.model, effort: run.effort, status: run.status };

function board(specId) {
  if (!loadedSpecs.has(specId)) throw new Error(`la spec ${specId} no está cargada`);
  const tasks = [...tasksById.values()].filter((item) => item.specId === specId).map((entry) => ({
    task: entry.task, tierOverride: entry.tierOverride, route: route(entry), routeError: null, dependenciesCompleted: depsDone(entry),
    approval: entry.approval, latestRun: storedRun(entry.runs.at(-1)), running: activeRun?.taskId === entry.task.id,
    retryable: ["interrupted", "failed"].includes(entry.task.status) || Boolean(entry.resumeFailed) }));
  return { spec: storedSpec(specId), tasks };
}

function newRun(entry) {
  const decision = route(entry);
  const n = entry.runs.length + 1;
  const run = { run_id: `${entry.task.id.toLowerCase()}-${n}-${Math.random().toString(16).slice(2, 10)}`, route_id: `route-${entry.task.id}-${n}`,
    task_id: entry.task.id, thread_id: `thread-${entry.task.id}-${n}`, prompt: entry.task.prompt, tier: decision.tier, model: decision.model,
    effort: decision.effort, status: "running", events: [] };
  run.record = (event_type, payload) => run.events.push({ run_id: run.run_id, event_type, payload });
  run.record("task.started", { taskId: entry.task.id, tier: decision.tier, model: decision.model, effort: decision.effort, route: decision });
  entry.runs.push(run);
  return run;
}

// Past runs, written the way the coordinator records them.
function seedRun(entry, status, text, verify) {
  const run = newRun(entry);
  const turnId = `turn-${entry.task.id}-1`;
  run.status = status;
  run.record("turn/started", { threadId: run.thread_id, turn: { id: turnId } });
  run.record("item/agentMessage/delta", { threadId: run.thread_id, turnId, delta: text });
  if (status !== "interrupted") run.record("item/completed", { threadId: run.thread_id, turnId, item: { id: "cmd-1", type: "commandExecution",
    command: "cargo test -p reports refunds", status: "completed", exitCode: 0, aggregatedOutput: "test refunds::partial ... ok\ntest result: ok. 3 passed" } });
  run.record("turn.completed", { taskId: entry.task.id, threadId: run.thread_id, turnId, status: status === "interrupted" ? "interrupted" : "completed", text });
  if (verify) run.record(verify.exitCode === 0 ? "task.verified" : "verification.failed", { taskId: entry.task.id, command: entry.task.verify,
    reason: verify.exitCode === 0 ? undefined : "task verification failed or returned no exit code",
    result: { exitCode: verify.exitCode, stdout: verify.stdout ?? "", stderr: verify.stderr ?? "" } });
}

async function streamTask(entry, run, resumed) {
  const { task } = entry;
  const threadId = run.thread_id;
  const turnId = `turn-${task.id}-${++counter}`;
  const send = (event) => taskEvent({ type: "session", taskId: task.id, event: { threadId, turnId, ...event } });
  let text = "";
  const say = async (words, pause = 30) => {
    for (const word of words.split(/(?<= )/)) {
      if (run.stop) return;
      send({ type: "agentDelta", delta: word });
      run.record("item/agentMessage/delta", { threadId, turnId, delta: word });
      text += word;
      await wait(pause);
    }
  };
  await wait(300);
  if (resumed) run.record("thread.resumed", { threadId });
  send({ type: "turnStarted" });
  run.record("turn/started", { threadId, turn: { id: turnId } });
  if (BEHAVIOUR[task.id] === "approval") {
    await say("Agrego el caso de diciembre con dos festivos y verifico el corte del día 15. ");
    const item = { id: `cmd-${turnId}`, type: "commandExecution", command: "cargo test -p reports holidays" };
    send({ type: "itemStarted", item });
    run.record("item/commandExecution/requestApproval", { threadId, turnId, itemId: item.id, command: item.command });
    send({ type: "approvalRequested", requestId: 950 + counter, kind: "command", itemId: item.id, command: item.command, cwd: project,
      reason: "fuera de la política del sandbox: necesita escribir en target/ compartido" });
    const decision = await new Promise((resolve) => { run.answer = resolve; });
    run.answer = null;
    const accepted = decision.startsWith("accept");
    if (accepted) send({ type: "commandOutput", itemId: item.id, delta: "test holidays::december ... ok\n" });
    const done = { ...item, status: accepted ? "completed" : "declined", exitCode: accepted ? 0 : null, aggregatedOutput: accepted ? "test holidays::december ... ok" : "" };
    send({ type: "itemCompleted", item: done });
    run.record("item/completed", { threadId, turnId, item: done });
    await say(accepted ? "El test pasa con los dos festivos." : "Sin permiso para ejecutar el test; dejo el caso escrito.");
  } else if (BEHAVIOUR[task.id] === "slow") {
    await say(`${resumed ? "Retomo desde la cabecera ya escrita. " : ""}Sigo con el formato de montos: separador decimal según la configuración regional, columnas fijas para fee_total y refund_total, y una fila de totales al final que cuadra con el agregado mensual.`, 220);
  } else {
    await say("Listo: revisé el código, apliqué el cambio dentro del alcance y dejé la evidencia en los tests.");
  }
  const status = run.stop ? "interrupted" : "completed";
  send({ type: "turnCompleted", status, error: null });
  run.record("turn.completed", { taskId: task.id, threadId, turnId, status, text });
  if (status === "completed") {
    await wait(900);
    run.record("task.verified", { taskId: task.id, command: task.verify, result: { exitCode: 0, stdout: "test result: ok. 14 passed; 0 failed", stderr: "" } });
  }
  run.status = status;
  task.status = status;
  return { task_id: task.id, route_id: run.route_id, run_id: run.run_id, thread_id: threadId, status, text };
}

// The gates of TaskCoordinator::dispatch_task: no turn when one fails.
function gate(entry) {
  const { task } = entry;
  const receipt = (status, text) => ({ task_id: task.id, route_id: null, run_id: null, thread_id: null, status, text });
  if (!OPEN.includes(task.status)) return receipt(task.status, "task is not ready for dispatch");
  if (!depsDone(entry)) { task.status = "blocked"; return receipt("blocked", "task has incomplete dependencies"); }
  if (task.approval !== "not_required" && entry.approval?.decision === "denied") { task.status = "blocked"; return receipt("blocked", "manual approval denied"); }
  if (task.approval !== "not_required" && entry.approval?.decision !== "approved") { task.status = "awaiting_approval"; return receipt("awaiting_approval", "explicit approval required"); }
  return null;
}

async function execute(entry, run, resumed = false) {
  activeRun.taskId = entry.task.id;
  activeRun.run = run;
  entry.task.status = "running";
  run.status = "running";
  return streamTask(entry, run, resumed);
}

function claim(label) {
  if (activeRun) throw new Error(`ya hay una ejecución en curso: ${activeRun.label}`);
  activeRun = { label, taskId: null, run: null };
}

const receiptOnly = (taskId, status, text) => ({ task_id: taskId, route_id: null, run_id: null, thread_id: null, status, text });

function taskCommand(cmd, args) {
  const entry = args.taskId ? tasksById.get(args.taskId) : null;
  if (args.taskId && !entry) throw new Error(`la tarea ${args.taskId} no existe`);
  switch (cmd) {
    case "spec_files":
      return specFiles.map((file) => (file.error
        ? { path: specPath(file.slug), specId: null, title: null, tasks: 0, loaded: false, error: file.error }
        : { path: specPath(file.slug), specId: file.spec.specId, title: file.spec.title, tasks: file.spec.tasks.length, loaded: loadedSpecs.has(file.spec.specId), error: null }));
    case "spec_load": return loadSpec(specFiles.find((file) => specPath(file.slug) === args.path)?.slug);
    case "spec_list": return [...loadedSpecs.keys()].map(storedSpec).sort((a, b) => Number(b.loadedAt) - Number(a.loadedAt));
    case "task_board": return board(args.specId);
    case "task_active": return activeRun ? activeRun.taskId ?? activeRun.label : null;
    case "task_set_tier":
      if (["running", "completed"].includes(entry.task.status)) throw new Error(`no se puede cambiar el tier de ${args.taskId}: no existe, está en curso o ya terminó`);
      entry.tierOverride = args.tier ?? null;
      return null;
    case "task_decide":
      entry.approval = { task_id: args.taskId, decision: args.approved ? "approved" : "denied", reason: "decidido en la app" };
      return null;
    case "task_run_events": return [...tasksById.values()].flatMap((item) => item.runs).find((run) => run.run_id === args.runId)?.events ?? [];
    case "task_retry":
      if (!["interrupted", "failed"].includes(entry.task.status) && !entry.resumeFailed) return receiptOnly(args.taskId, entry.task.status, "task is not retryable");
      entry.resumeFailed = false;
      entry.task.status = "ready";
      return receiptOnly(args.taskId, "ready", "task ready for retry");
    case "task_recover":
      entry.task.status = "interrupted";
      return receiptOnly(args.taskId, "interrupted", "recuperada desde la app");
    case "task_interrupt":
      if (activeRun?.taskId !== args.taskId) throw new Error(`la tarea ${args.taskId} no se está ejecutando`);
      activeRun.run.stop = true;
      return null;
    case "task_approval":
      if (activeRun?.taskId !== args.taskId || !activeRun.run?.answer) throw new Error(`la tarea ${args.taskId} no se está ejecutando`);
      activeRun.run.answer(args.decision);
      return null;
    case "task_dispatch":
      claim(args.taskId);
      (async () => {
        const receipt = gate(entry) ?? await execute(entry, newRun(entry));
        activeRun = null;
        taskEvent({ type: "finished", taskId: entry.task.id, receipt });
      })();
      return null;
    case "task_dispatch_ready":
      claim(`spec ${args.specId}`);
      (async () => {
        const receipts = [];
        for (;;) {
          const next = [...tasksById.values()].find((item) => item.specId === args.specId && OPEN.includes(item.task.status)
            && depsDone(item) && !receipts.some((receipt) => receipt.task_id === item.task.id));
          if (!next) break;
          receipts.push(gate(next) ?? await execute(next, newRun(next)));
        }
        activeRun = null;
        for (const receipt of receipts) taskEvent({ type: "finished", taskId: receipt.task_id, receipt });
      })();
      return null;
    case "task_resume": {
      const owner = [...tasksById.values()].find((item) => item.runs.some((run) => run.run_id === args.runId));
      const run = owner?.runs.find((item) => item.run_id === args.runId);
      if (!run) throw new Error(`la ejecución ${args.runId} no existe`);
      claim(owner.task.id);
      run.stop = false;
      (async () => {
        const receipt = await execute(owner, run, true);
        activeRun = null;
        taskEvent({ type: "finished", taskId: owner.task.id, receipt });
      })();
      return null;
    }
    default: throw new Error(`Unexpected command: ${cmd}`);
  }
}

mockIPC(async (cmd, args) => {
  // Tauri serializes every reply; a clone keeps the mock from sharing state.
  if (cmd.startsWith("spec_") || cmd.startsWith("task_")) return structuredClone(taskCommand(cmd, args));
  switch (cmd) {
    case "router_config": return config;
    case "settings_set_language": config.language = args.language; return config;
    case "settings_set_codex_desktop": config.savings = { include_codex_desktop: args.enabled }; return config;
    case "savings_summary": return savingsSummary();
    // ?migrated=1 shows the notice of a first start that copied old data.
    case "startup_migration": return new URLSearchParams(location.search).get("migrated")
      ? { from: String.raw`C:\Users\dev\AppData\Local\RouDex`, to: String.raw`C:\Users\dev\.roudex`, store: true, config: true } : null;
    case "router_decide": await wait(400); return decide(args.prompt);
    case "router_escalate": return { ...args.decision, tier: "fuerte", ...config.tiers.fuerte, source: "manual", reason: `escalado manual desde ${args.decision.tier}` };
    case "chat_projects": return [...new Set(threads.map((t) => t.cwd))];
    case "thread_list":
      if (args.project !== undefined && args.project !== null && !String(args.project).includes("proyectos")) throw new Error("carpeta de proyecto inválida: no existe");
      return summaries(Boolean(args.includeArchived));
    case "chat_turns": return turns[args.threadId] ?? [];
    case "dashboard_summary": return dashboard();
    case "desktop_hook_summary": return desktopHook();
    case "desktop_hook_install":
      if (new URLSearchParams(location.search).get("bundled") !== "1") throw new Error("this build has no bundled router-cli; run router-cli hook-install from a terminal");
      hookInstalled = true;
      return { hooksPath: String.raw`C:\Users\dev\.codex\hooks.json`, command: "C:/Users/dev/.roudex/bin/router-cli.exe hook",
        binary: String.raw`C:\Users\dev\.roudex\bin\router-cli.exe`, replaced: 0, removedLegacy: 0, legacyManagedHook: null };
    case "usage_summary": return { models: [], rateLimits: limits };
    case "thread_rename": { const t = threads.find((x) => x.thread_id === args.threadId); if (t) t.title = args.title.trim(); return Boolean(t); }
    case "thread_archive": { const t = threads.find((x) => x.thread_id === args.threadId); if (t) t.archived = args.archived; return Boolean(t); }
    case "chat_send": {
      let thread = threads.find((t) => t.thread_id === args.threadId);
      if (!thread) {
        thread = { thread_id: `t${++counter}`, cwd: args.project, title: args.prompt.slice(0, 80), access: args.access ?? "write", archived: false, created_at: String(now()), updated_at: String(now()) };
        threads.push(thread);
        turns[thread.thread_id] = [];
      }
      thread.updated_at = String(now());
      const record = { turn_id: `u${++counter}`, thread_id: thread.thread_id, prompt: args.prompt, ...args.decision, status: "running",
        response: "", error: null, tokens: { input: 0, cached_input: 0, output: 0, reasoning: 0, total: 0 }, created_at: String(now()), completed_at: null };
      delete record.risk;
      turns[thread.thread_id].push(record);
      stream(thread.thread_id, record);
      return { threadId: thread.thread_id, turnId: record.turn_id };
    }
    case "chat_approval": {
      const record = Object.values(turns).flat().find((t) => t.pending);
      if (record) {
        record.pending = false;
        session({ type: "itemCompleted", threadId: record.thread_id, turnId: record.turn_id,
          item: { id: "cmd-" + record.turn_id, type: "commandExecution", command: "cargo test -p reports holidays",
            status: args.decision.startsWith("accept") ? "completed" : "declined", exitCode: args.decision.startsWith("accept") ? 0 : null } });
        finish(record.thread_id, record, `\nDecisión: ${args.decision}.`);
      }
      return null;
    }
    case "chat_interrupt": return null;
    default: throw new Error(`Unexpected command: ${cmd}`);
  }
}, { shouldMockEvents: true });

localStorage.setItem("roudex.project", JSON.stringify("C:\\proyectos\\api-service"));
localStorage.setItem("roudex.view", JSON.stringify(new URLSearchParams(location.search).get("view") ?? "resumen"));
await import("../src/main.jsx");
</script>
